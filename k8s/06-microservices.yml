# ==========================================
# Config Server
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: razorpay-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: razorpay/config-server:latest
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: razorpay-common-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: razorpay-system
spec:
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: config-server
---
# ==========================================
# User Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: razorpay-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: razorpay/user-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: razorpay-common-config
            - secretRef:
                name: razorpay-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/razorpay_user_db"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: razorpay-system
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: user-service
---
