server:
  port: 8088

spring:
  application:
    name: ai-assistant-service
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-mock-key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
